# Sized for 8 GB dev machines (the template default of -Xmx8G caused heavy swapping).
org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# Kotlin incremental caches break when the project and the pub cache are on different drives
# (e.g. D:\ vs C:\) on Windows; compile in-process to save memory.
kotlin.incremental=false
kotlin.compiler.execution.strategy=in-process
