services:
  postgres:
    image: postgres:17-alpine
    container_name: classpluse-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: classpluse
      POSTGRES_PASSWORD: classpluse
      POSTGRES_DB: classpluse
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U classpluse -d classpluse"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
